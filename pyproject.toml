[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "mc-minigame-manager"
version = "0.2.0"
description = "Minecraft minigame map, save, backup, Paper runtime and FRP port manager"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13,<2",
  "docker>=7.1,<8",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "nbtlib>=2.0,<3",
  "pydantic-settings>=2.5,<3",
  "python-multipart>=0.0.12,<1",
  "sqlalchemy>=2.0.35,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.6,<1",
  "types-docker>=7.1,<8",
]

[project.scripts]
mc-manager-api = "mc_manager.app:main"
mc-manager-worker = "mc_manager.worker:main"
mc-manager-init = "mc_manager.cli:init_command"

[tool.hatch.build.targets.wheel]
packages = ["src/mc_manager"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["mc_manager"]
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]

[tool.pydantic-mypy]
init_forbid_extra = true
warn_required_dynamic_aliases = true
